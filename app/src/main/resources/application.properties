spring.config.import=optional:file:.env[.properties]
server.port=${APP_PORT:8080}

hotel.room.status.changing=true
hotel.room.history.limit=3

database.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
database.user=${DATABASE_USER}
database.password=${DATABASE_PASSWORD}

jwt.secret=${JWT_SECRET}

hotel.admin.username=${HOTEL_ADMIN_USERNAME}
hotel.admin.password=${HOTEL_ADMIN_PASSWORD}